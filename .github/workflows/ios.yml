name: iOS

# Manual only: private-repo macOS minutes are ~200/month (2,000 pool at 10x), so nothing runs
# unless you start it. Use "Run workflow" on the Actions tab.
on:
  workflow_dispatch:
    inputs:
      simulator:
        description: "Also boot the simulator, launch, and screenshot (adds ~2-3 minutes)"
        type: boolean
        default: true

jobs:
  build:
    # macOS runners are the only way to compile iOS, and this machine has no Mac.
    # macos-13 (Intel) is the image available to this account; macos-14 resolved to an
    # arm64 configuration that is not provisioned here.
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: |
            build
            build-device
          key: ${{ runner.os }}-xcode-${{ hashFiles('ObsidianApp/**', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild -project Obsidian.xcodeproj -scheme Obsidian \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Launch in simulator and screenshot
        if: ${{ inputs.simulator }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          echo "Using device $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=build/Build/Products/Debug-iphonesimulator/Obsidian.app
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" app.obsidian.ios || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot ios-screenshot.png

      - name: Build unsigned device app
        run: |
          xcodebuild -project Obsidian.xcodeproj -scheme Obsidian \
            -sdk iphoneos -configuration Release -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Obsidian.app Payload/
          zip -qry Obsidian-unsigned.ipa Payload
          ls -lh Obsidian-unsigned.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-ios
          path: |
            Obsidian-unsigned.ipa
            ios-screenshot.png
          if-no-files-found: warn
