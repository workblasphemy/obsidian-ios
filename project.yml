# XcodeGen spec. The CI runner turns this into Obsidian.xcodeproj; nothing generated is committed.
name: Obsidian
options:
  bundleIdPrefix: app.obsidian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  Obsidian:
    type: application
    platform: iOS
    sources:
      - path: ObsidianApp
    settings:
      base:
        INFOPLIST_FILE: ObsidianApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.obsidian.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
